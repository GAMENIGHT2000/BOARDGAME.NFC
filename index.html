if(g.shelf!=null&&String(g.shelf).trim())link('Return to Shelf '+g.shelf,'shelf='+encodeURIComponent(shelfKey(g.shelf)) ,root,'button shelf-button');
const stats=element('a','🎲 Log a Play in BG Stats','button');stats.href='https://app.bgstatsapp.com/addPlay.html?gameId='+encodeURIComponent(id);
if(g.video){const a=element('a','▶️ Watch How to Play','button');a.href=g.video;a.target='_blank';a.rel='noopener noreferrer';}
const details=element('section',null,'details');
const fields=[['Shelf Location',g.shelf],['Minimum Players',g.minPlayers],['Maximum Players',g.maxPlayers],['Best Player Count',g.bestPlayers],['Estimated Play Time',g.playMinutes==null?null:g.playMinutes+' minutes'],['Learning Difficulty',g.difficulty==null?null:Number(g.difficulty).toFixed(2)+' out of 5'],['BGG Rank',g.bggRank],['Tutorial Length',g.tutorialMinutes==null?null:g.tutorialMinutes+' minutes']];
for(const [k,v] of fields){if(v==null||v==='')continue;element('div',k+': '+v,k==='Learning Difficulty'?'difficulty':'',details);}
if(!details.children.length)details.hidden=true;
}
if(query.has('game'))showGame(query.get('game'));
else if(query.has('shelf'))showShelf(query.get('shelf'));
else if(query.has('players'))showPlayerResults(query.get('players'));
else if(query.get('browse')==='shelves')showShelves();
else if(query.get('browse')==='players')showPlayers();
else showGameRoom();
</script></body></html>
