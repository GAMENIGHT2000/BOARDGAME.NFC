const query = new URLSearchParams(location.search);
const shelfRequested = query.get('shelf');
const gameId = query.get('game') || Object.keys(games)[0];
if (shelfRequested !== null) {
  document.getElementById('gameView').hidden = true;
  document.getElementById('gameTitle').hidden = true;
  document.getElementById('shelfView').hidden = false;
  const shelfName = shelfRequested.trim();
  document.getElementById('shelfHeading').textContent = 'Shelf ' + shelfName;
  document.title = 'Shelf ' + shelfName + ' | Joey’s Board Game Night';
  const matches = Object.entries(games).filter(([id, g]) =>
    g.shelf !== null && g.shelf !== undefined &&
    String(g.shelf).trim().toLowerCase() === shelfName.toLowerCase()
  ).sort((a,b) => a[1].name.localeCompare(b[1].name, undefined, {sensitivity:'base'}));
  const list = document.getElementById('shelfList');
  if (!matches.length) {
    const message = document.createElement('p');
    message.textContent = 'No games are assigned to this shelf in the spreadsheet.';
    list.appendChild(message);
  }
  for (const [id,g] of matches) {
    const a = document.createElement('a');
    a.className = 'button';
    a.href = '?game=' + encodeURIComponent(id);
    a.textContent = g.name;
    list.appendChild(a);
  }
}
const gameId = new URLSearchParams(location.search).get('game') || Object.keys(games)[0];
const game = games[gameId];
const title = document.getElementById('gameTitle');
const picture = document.getElementById('joeyPicture');
const label = document.getElementById('rankingLabel');
const stats = document.getElementById('statsButton');
const video = document.getElementById('videoButton');
if (shelfRequested !== null) {
  // Shelf listing is displayed above; skip individual game rendering.
} else if (!game) {
  title.textContent='Game Not Found';
  picture.hidden=true;label.hidden=true;stats.hidden=true;video.hidden=true;
  document.getElementById('error').hidden=false;
} else {
  title.textContent=game.name;
  document.title=game.name+' | Joey’s Board Game Night';
  stats.href='https://app.bgstatsapp.com/addPlay.html?gameId='+encodeURIComponent(gameId);
  if(game.video){video.href=game.video;video.target='_blank';video.rel='noopener noreferrer';}
  else {video.textContent='▶️ Tutorial Coming Soon';video.removeAttribute('href');}
  const rank=game.ranking;
  if(rank===0){label.textContent='Not Played Yet';picture.src='joey-unplayed.jpg';}
  else if(rank==null){label.textContent='Ranking Not Assigned';picture.src='joey-neutral.jpg';}
  else {
    label.textContent='Joey’s Ranking: '+rank;
    picture.src=rank>7?'joey-excited.jpg':rank<4.5?'joey-disgusted.jpg':'joey-neutral.jpg';
  }
  const details=document.getElementById('gameDetails');
  const fields=[['Shelf location',game.shelf],['Maximum players',game.maxPlayers],['Learning Difficulty',game.difficulty],['Tutorial length (minutes)',game.tutorialMinutes],['Published',game.year]];
  for(const [key,value] of fields){
    if(value!==null&&value!==undefined&&value!==''){
      const line=document.createElement('div');const strong=document.createElement('strong');strong.textContent=key+': ';
      if(key==='Learning Difficulty')line.classList.add('difficulty-row');
      line.append(strong,document.createTextNode(key==='Learning Difficulty' ? Number(value).toFixed(2)+' out of 5' : String(value)));details.appendChild(line);
    }
  }
  if(details.children.length){details.hidden=false;}
  if(Array.isArray(game.expansions)&&game.expansions.length){
    const section=document.getElementById('expansionSection');section.hidden=false;
    const list=document.getElementById('expansionList');
    for(const expansion of game.expansions){
      const p=document.createElement('p');
      if(expansion.id){const a=document.createElement('a');a.href='https://boardgamegeek.com/boardgame/'+encodeURIComponent(expansion.id);a.textContent=expansion.name;a.target='_blank';a.rel='noopener noreferrer';p.appendChild(a);}
      else{p.textContent=expansion.name;}
      list.appendChild(p);
    }
  }
}
