function supports(g,n){if(g.minPlayers==null||g.maxPlayers==null)return false;const min=Number(g.minPlayers),max=Number(g.maxPlayers);return Number.isFinite(min)&&Number.isFinite(max)&&min<=n&&max>=n;}

 

 

 

function best(g,n){return String(g.bestPlayers??'').split(/[^0-9]+/).some(x=>x!==''&&Number(x)===n);}

 

 

 

function playerView(v){const over=v==='12plus',n=Number(v);title.textContent=over?'12+ Players':n+' Players';if(!over&&(!Number.isInteger(n)||n<2||n>12)){add('p','Invalid player count');return;}

 

 

 

const matches=baseEntries().filter(([id,g])=>over?(g.maxPlayers!=null&&Number(g.maxPlayers)>12):supports(g,n));

 

 

 

const recommended=sorted(matches.filter(([id,g])=>over?String(g.bestPlayers??'').split(/[^0-9]+/).some(x=>x!==''&&Number(x)>12):best(g,n)));

 

 

 

const ids=new Set(recommended.map(([id])=>id));

 

 

 

const other=sorted(matches.filter(([id])=>!ids.has(id)));

 

 

 

add('h2','Best for '+(over?'12+':n)+' Players','group-title');if(!recommended.length)add('p','No best-player matches recorded.');for(const [id,g] of recommended)link(g.name,'game='+encodeURIComponent(id));

 

 

 

add('h2','Also Supports '+(over?'12+':n)+' Players','group-title');if(!other.length)add('p','No additional games recorded.');for(const [id,g] of other)link(g.name,'game='+encodeURIComponent(id));

 

 

 

}

 

 

 

function gameView(id){if(expansionParent[id]){location.replace(base+'?game='+encodeURIComponent(expansionParent[id]));return;}

 

 

 

const g=games[id];if(!g){title.textContent='Game Not Found';add('p','This BGG ID is not in the current workbook.');return;}

 

 

 

title.textContent=g.name;document.title=g.name+' | Joey’s Board Game Night';

 

 

 

const img=add('img',null,'portrait');img.alt='Joey rating reaction';

 

 

 

const rank=g.ranking==null?null:Number(g.ranking);

 

 

 

img.src=rank===0?'joey-unplayed.jpg':rank===null?'joey-unplayed.jpg':rank<3?'joey-terrible.jpg':rank<5?'joey-disgusted.jpg':rank<6.5?'joey-neutral.jpg':rank<8?'joey-happy.jpg':rank<9?'joey-excited.jpg':'joey-top-ten.jpg';

 

 

 

add('div',rank===0?'Not Played Yet':rank===null?'Ranking Not Assigned':'Joey’s Ranking: '+g.ranking,'rank');

 

 

 

if(g.shelf!==null&&g.shelf!==undefined&&String(g.shelf).trim()!=='')link('Return to '+shelfLabel(g.shelf),'shelf='+encodeURIComponent(shelfKey(g.shelf)),root,'button shelf-button');

 

 

 

if(g.expansions.length){const sec=add('section',null,'details expansions');add('h2','Expansions I Own','group-title',sec);for(const e of g.expansions){const p=add('div',null,null,sec);const a=add('a',e.name,null,p);a.href='https://boardgamegeek.com/boardgame/'+encodeURIComponent(e.id);a.target='_blank';a.rel='noopener noreferrer';}}

 

 

 

const stats=add('a','🎲 Log a Play in BG Stats','button');stats.href='https://app.bgstatsapp.com/addPlay.html?gameId='+encodeURIComponent(id);

 

 

 

if(g.video){const a=add('a','▶️ Watch How to Play','button');a.href=g.video;a.target='_blank';a.rel='noopener noreferrer';}

 

 

 

if(g.video){

 

 

 

 const tv=add('button','📺 Play on Game Room TV','button');

 

 

 

 tv.type='button';

 

 

 

 tv.onclick=()=>{

 

 

 

  if(!BOARDGAME_TV_HTTPS_BASE){alert('Game Room TV is not connected to this website yet. The existing Watch How to Play link still works.');return;}

 

 

 

  const target=BOARDGAME_TV_HTTPS_BASE.replace(/\/$/,'')+BOARDGAME_TV_PLAY_PATH;

 

 

 

  // Receiver accepts POST JSON. Its CORS policy must allow this GitHub Pages origin.

 

 

 

 

 

 

 

  fetch(target,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:g.video}),mode:'cors'}).then(r=>{if(!r.ok)throw Error('Receiver rejected request');alert('Video request sent to Game Room TV.');}).catch(()=>alert('TV connection failed. Check your HTTPS receiver URL and CORS settings.'));

 

 

 

 };

 

 

 

}

 

 

 

 

 

// AI rules chat: the receiver opens the correct conversation on the Game Room computer.

 

if (gameRulesChats[id]) {

 

 const rulesBtn=add('button','🤖 AI Rules on Game Room TV','button');

 

 rulesBtn.type='button';

 

 rulesBtn.onclick=()=>{

 

  if(!BOARDGAME_TV_HTTPS_BASE){alert('Game Room receiver URL has not been configured.');return;}

 

  const target=BOARDGAME_TV_HTTPS_BASE.replace(/\/$/,'')+BOARDGAME_TV_RULES_PATH;

 

  fetch(target,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:gameRulesChats[id]}),mode:'cors'})

 

   .then(r=>{if(!r.ok)throw Error('Rules receiver rejected request ('+r.status+')');alert('Opening AI Rules on Game Room TV.');})

 

   .catch(err=>{alert('Could not open rules on Game Room TV. Check receiver and Tailscale.');console.error(err);});

 

 };

 

}

 

 

 

const bgg=add('a','📖 BoardGameGeek — Game Information','button');bgg.href='https://boardgamegeek.com/boardgame/'+encodeURIComponent(id);bgg.target='_blank';bgg.rel='noopener noreferrer';

 

 

 

const files=add('a','📚 Game Rules & Files on BGG','button');files.href='https://boardgamegeek.com/boardgame/'+encodeURIComponent(id)+'/files';files.target='_blank';files.rel='noopener noreferrer';

 

 

 

const details=add('section',null,'details');

 

 

 

const fields=[['Shelf Location',g.shelf===null?null:shelfLabel(g.shelf)],['Minimum Players',g.minPlayers],['Maximum Players',g.maxPlayers],['Best Player Count',g.bestPlayers],['Estimated Play Time',g.playMinutes==null?null:g.playMinutes+' minutes'],['Learning Difficulty',g.difficulty==null?null:Number(g.difficulty).toFixed(2)+' out of 5'],['BGG Rank',g.bggRank],['Tutorial Length',g.tutorialMinutes==null?null:g.tutorialMinutes+' minutes']];

 

 

 

for(const [key,val] of fields){if(val==null||val==='')continue;add('div',key+': '+val,key==='Learning Difficulty'?'difficulty':'',details);}

 

 

 

if(!details.children.length)details.hidden=true;

 

 

 

 

 

}

 

 

 

if(query.has('game'))gameView(query.get('game'));

 

 

 

else if(query.has('shelf'))shelfView(query.get('shelf'));

 

 

 

else if(query.has('players'))playerView(query.get('players'));

 

 

 

else if(query.get('browse')==='shelves')shelves();

 

 

 

else if(query.get('browse')==='players')players();

 

 

 

else room();

 

 

 

</script>

 

 

 

</body></html>
